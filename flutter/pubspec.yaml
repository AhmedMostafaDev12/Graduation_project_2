name: remori
description: "Remori companion app for patients and caregivers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  sqlite3: ^3.7.0
  uuid: ^4.6.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/remori-logo.svg
    - assets/images/google.svg
    - assets/images/facebook.svg
    - assets/images/login-email.svg
    - assets/images/login-password.svg
    - assets/images/login-eye.svg
    - assets/images/pair-qr.svg
    - assets/images/pair-info.svg
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM-Sans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/Readex-Pro.ttf
