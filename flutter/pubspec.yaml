name: remori
description: "Remori companion app for patients and caregivers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/remori-logo.svg
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM-Sans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/Readex-Pro.ttf
