# Pull-request checks for the Remori monorepo.
# Each area only runs its own checks (path filters), so a Flutter PR never waits on backend tests.
# Nothing here deploys. See docs/TEAM_WORKFLOW.md for what each check means and how to fix a red one.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-ai/**'
            flutter:
              - 'flutter/**'

  hygiene:
    name: Conflict hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Branch contains the latest main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::This branch is behind main. Run: git fetch origin && git merge origin/main, fix any conflicts locally, then push."
            exit 1
          fi

      - name: No leftover conflict markers
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/main...HEAD)
          [ -z "$files" ] && exit 0
          if echo "$files" | xargs grep -nE '^(<<<<<<<|>>>>>>>)( |$)' --; then
            echo "::error::Conflict markers (<<<<<<< / >>>>>>>) were committed. Resolve them and push again."
            exit 1
          fi

  backend:
    name: Backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Formatting (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          if [ -d tests ]; then
            pytest -q || code=$?
            # exit code 5 = no tests collected yet; not a failure while the project is young
            if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 5 ]; then exit "$code"; fi
          else
            echo "No tests/ folder yet, skipping."
          fi

  flutter:
    name: Flutter (format + analyze + test)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - name: Is the Flutter app created yet?
        id: app
        run: |
          if [ -f pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml yet, skipping Flutter checks."; fi

      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Get packages
        if: steps.app.outputs.exists == 'true'
        run: flutter pub get

      - name: Formatting (dart format)
        if: steps.app.outputs.exists == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.app.outputs.exists == 'true'
        run: flutter analyze

      - name: Tests
        if: steps.app.outputs.exists == 'true'
        run: |
          if [ -d test ]; then flutter test; else echo "No test/ folder yet, skipping."; fi
