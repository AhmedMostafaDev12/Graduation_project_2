[tool.ruff]
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style (as in the course): `db: Session = Depends(get_db)`
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
