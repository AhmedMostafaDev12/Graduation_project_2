# nginx site for the Remori API: the course's `nginx` file plus what Remori needs.
# Installed at /etc/nginx/sites-available/remori-api (linked into sites-enabled).
# certbot adds the HTTPS (443) server block and the HTTP -> HTTPS redirect to this file.

server {
        listen 80;
        listen [::]:80;

        server_name remori-ai.duckdns.org;

        # Enrollment uploads 1-5 photos in one request; nginx's default limit is 1 MB.
        client_max_body_size 25m;

        location / {
                proxy_pass http://127.0.0.1:8000;
                proxy_http_version 1.1;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                # Tells the app the original request was HTTPS (correct URLs in /docs, redirects)
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $http_host;
                proxy_set_header X-NginX-Proxy true;
                proxy_redirect off;
                # The slowest endpoint (/assist, LLM) answers within seconds; 60 s is the ceiling.
                proxy_read_timeout 60s;
        }
}
